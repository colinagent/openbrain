name: Public boundary

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: scripts/check-openbrain-public-boundary.sh
      - run: go test ./integrations/opagent/... ./protocol/remotecontrol/... ./skills/openbrain-cloud-sync/...
      - run: go vet ./integrations/opagent/... ./protocol/remotecontrol/... ./skills/openbrain-cloud-sync/...
      - run: node --test skills/openbrain-cloud-sync/SKILL.source.test.mjs
